s="table table-sm table-borderless"> <tr> <th scope="row">Sep 21, 2025</th> <td> <a class="post-link" href="/log/blog/2025/refrag/">REFRAG: Rethinking RAG-Based Decoding</a> </td> </tr> </table> </div> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Yejin Kim. Built with <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> and the <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/log/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/log/assets/js/masonry.js" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/log/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/log/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/log/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/log/assets/js/copy_code.js?12775fdf7f95e901d7119054556e495f" type="text/javascript"></script> <script defer src="/log/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script type="text/javascript">window.MathJax={tex:{tags:"ams"}};</script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6" crossorigin="anonymous"></script> <script type="text/javascript">function progressBarSetup(){"max"in document.createElement("progress")?(initializeProgressElement(),$(document).on("scroll",function(){progressBar.attr({value:getCurrentScrollPosition()})}),$(window).on("resize",initializeProgressElement)):(resizeProgressBar(),$(document).on("scroll",resizeProgressBar),$(window).on("resize",resizeProgressBar))}function getCurrentScrollPosition(){return $(window).scrollTop()}function initializeProgressElement(){let e=$("#navbar").outerHeight(!0);$("body").css({"padding-top":e}),$("progress-container").css({"padding-top":e}),progressBar.css({top:e}),progressBar.attr({max:getDistanceToScroll(),value:getCurrentScrollPosition()})}function getDistanceToScroll(){return $(document).height()-$(window).height()}function resizeProgressBar(){progressBar.css({width:getWidthPercentage()+"%"})}function getWidthPercentage(){return getCurrentScrollPosition()/getDistanceToScroll()*100}const progressBar=$("#progress");window.onload=function(){setTimeout(progressBarSetup,50)};</script> <script src="/log/assets/js/vanilla-back-to-top.min.js?f40d453793ff4f64e238e420181a1d17"></script> <script>addBackToTop();</script> <script type="module" src="/log/assets/js/search/ninja-keys.min.js?a3446f084dcaecc5f75aa1757d087dcf"></script> <ninja-keys hidebreadcrumbs noautoloadmdicons placeholder="Type to start searching"></ninja-keys> <script>let searchTheme=determineComputedTheme();const ninjaKeys=document.querySelector("ninja-keys");"dark"===searchTheme?ninjaKeys.classList.add("dark"):ninjaKeys.classList.remove("dark");const openSearchModal=()=>{const e=$("#navbarNav");e.hasClass("show")&&e.collapse("hide"),ninjaKeys.open()};</script> <script>const ninja=document.querySelector("ninja-keys");ninja.data=[{id:"nav-about",title:"About",section:"Navigation",handler:()=>{window.location.href="/log/"}},{id:"nav-blog",title:"Blog",description:"",section:"Navigation",handler:()=>{window.location.href="/log/blog/"}},{id:"nav-explorations",title:"Explorations",description:"Short writeups introducing recent ML techniques together with my own hands-on experiments.",section:"Navigation",handler:()=>{window.location.href="/log/explorations/"}},{id:"nav-cv",title:"CV",description:"",section:"Navigation",handler:()=>{window.location.href="/log/cv/"}},{id:"nav-reports",title:"Reports",description:"Periodic analyses on recent inference architecture trends.",section:"Navigation",handler:()=>{window.location.href="/log/reports/"}},{id:"post-landscape-of-thoughts-visualizing-where-llm-reasoning-actually-goes",title:"Landscape of Thoughts \u2014 Visualizing Where LLM Reasoning Actually Goes",description:"Paper review of Landscape of Thoughts (Zhou, Zhu, Li, Galkin, Feng, Koyejo, Tang, Han \u2014 ICLR 2026, TMLR Group @ HKBU / Stanford / Mila / Universit\xe9 de Montr\xe9al / HEC Montr\xe9al / Intel AI Lab) \u2014 the first visualization tool that projects every intermediate reasoning state of an LLM&#39;s chain-of-thought trajectory into a 2D &quot;landscape&quot; relative to the answer choices, turning perplexity-based distance into a picture of how (and whether) reasoning converges toward the right answer.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/landscape-of-thoughts/"}},{id:"post-magellan-guided-mcts-for-escaping-the-gravity-wells-of-llm-creativity",title:"Magellan \u2014 Guided MCTS for Escaping the Gravity Wells of LLM Creativity",description:"Paper review of Magellan (Lufan Chang, agents4science 2025) \u2014 a framework that reframes creative idea generation as guided MCTS over an LLM&#39;s latent conceptual space, replacing unreliable self-evaluation heuristics (as used in Tree-of-Thoughts) with a hierarchical guidance system: a global &quot;semantic compass&quot; and a local landscape-aware value function combining coherence, novelty, and progress.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/magellan/"}},{id:"post-priorzero-injecting-llm-priors-into-muzero-style-world-models-at-the-mcts-root",title:"PriorZero \u2014 Injecting LLM Priors into MuZero-Style World Models at the MCTS Root...",description:"Paper review of PriorZero (Xiong, Pu, Tang, Niu) \u2014 a method for combining LLM semantic priors with UniZero-style latent world models by blending the LLM&#39;s policy prior into MCTS only at the root node, preserving the world model&#39;s own deep lookahead while cheaply steering exploration toward semantically plausible actions. Strong gains on sparse-reward Jericho text-adventures and compositional generalization in BabyAI.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/priorzero/"}},{id:"post-superthoughts-reasoning-tokens-in-superposition",title:"SuperThoughts \u2014 Reasoning Tokens in Superposition",description:"Paper review of SuperThoughts (Xiong, Garg, Yu, Shrivastava, Zhao, Kyrillidis, Papailiopoulos, ICML 2026, UW-Madison / Microsoft Research / Princeton / Rice) \u2014 compressing pairs of consecutive chain-of-thought tokens into a single latent representation and decoding two tokens per step via a lightweight multi-token-prediction module, with a confidence-gated fallback to standard decoding on hard reasoning steps. ~20-30% CoT length reduction near accuracy parity.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/superthoughts/"}},{id:"post-huginn-scaling-test-time-compute-via-recurrent-depth-in-latent-space",title:"Huginn \u2014 Scaling Test-Time Compute via Recurrent Depth in Latent Space",description:"Paper review of &quot;Scaling up Test-Time Compute with Latent Reasoning: A Recurrent Depth Approach&quot; (Geiping, McLeish, Jain, Kirchenbauer, Singh, Bartoldson, Kailkhura, Bhatele, Goldstein \u2014 ELLIS Institute Tubingen, University of Maryland, Lawrence Livermore National Laboratory) \u2014 the &quot;Huginn&quot; model, which scales test-time compute by looping a shared recurrent block in latent space instead of emitting explicit chain-of-thought tokens, trained at 3.5B parameters / 800B tokens on the Frontier supercomputer.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/recurrent-depth/"}},{id:"post-loopformer-elastic-depth-looped-transformers-via-shortcut-modulation",title:"LoopFormer \u2014 Elastic-Depth Looped Transformers via Shortcut Modulation",description:"Paper review of LoopFormer (Jeddi, Ciccone, Taati, ICLR 2026, University of Toronto / Vector Institute / UHN) \u2014 a looped transformer trained on variable-length recurrence trajectories so a single set of weights supports elastic inference-time depth. A shortcut-consistency training scheme distills coarse-schedule representations toward fine-schedule ones, letting users trade compute for quality at inference without retraining.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/loopformer/"}},{id:"post-think-at-hard-selective-latent-iteration-for-looped-reasoning-transformers",title:"Think-at-Hard \u2014 Selective Latent Iteration for Looped Reasoning Transformers",description:"Paper review of Think-at-Hard / TaH (Fu, You, Chen, Dai, Yang, Wang, Tsinghua University) \u2014 a looped transformer that learns to run a second latent iteration only on tokens likely to be wrong after the first pass, via a lightweight decider, duo-causal attention across the (position, depth) grid, and depth-aware LoRA adapters. TaH gains 8-11% accuracy over a fixed-two-iteration baseline while skipping 94% of second passes.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/think-at-hard/"}},{id:"post-process-reward-agents-online-step-wise-steering-for-knowledge-intensive-reasoning",title:"Process Reward Agents \u2014 Online Step-Wise Steering for Knowledge-Intensive Reasoning",description:"Paper review of PRA (Sohn, Sternal et al., ICML 2026, ETH Z\xfcrich / Heidelberg) \u2014 a framework that trains a separate reward agent to provide online, process-level, retrieval-grounded feedback to a frozen policy model during beam search. A 0.5B\u20138B frozen reasoner gets up to +25.7% on MedQA; Qwen3-4B-Instruct reaches 80.8% SOTA at 4B scale. Self-Consistency degrades on hard benchmarks; PRA continues improving as inference compute scales.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/pra/"}},{id:"post-tele-lens-how-far-ahead-do-llms-actually-plan-in-chain-of-thought",title:"Tele-Lens \u2014 How Far Ahead Do LLMs Actually Plan in Chain-of-Thought?",description:"Paper review of Tele-Lens (Xu, Yu et al., ICML 2026, WeChat AI / Tencent) \u2014 a probing framework that measures how far ahead LLMs plan in hidden states during chain-of-thought reasoning. The answer: myopic. Final-answer probability in hidden states stays near chance (0.49\u20130.51) throughout CoT for compositional tasks, spiking to 0.94\u20130.99 only in the last 1\u20132 steps. Leveraging this, pivot-based uncertainty estimation improves accuracy +6%, and automatic CoT bypass achieves 16.2% bypass rate with negligible performance loss.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/tele-lens/"}},{id:"post-reasoning-cache-continual-improvement-over-long-horizons-via-short-horizon-rl",title:"Reasoning Cache \u2014 Continual Improvement Over Long Horizons via Short-Horizon RL",description:"Paper review of Reasoning Cache / RC (Wu, Qu et al., ICLR 2026, CMU) \u2014 an iterative decode-and-summarize algorithm that lets LLMs trained on short token budgets extrapolate to reasoning horizons more than 10\xd7 longer at test time. A summary replay buffer trains the model to condition effectively on intermediate states. RCT-4B (trained at 16K tokens) reaches ~70% on HMMT-Nov-2025 and surpasses Qwen3-30B-A3B on IMO-AnswerBench at 256K-token test budget.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/reasoning-cache/"}},{id:"post-context-folding-scaling-long-horizon-llm-agents-via-branch-and-fold",title:"Context-Folding \u2014 Scaling Long-Horizon LLM Agents via Branch-and-Fold",description:"Paper review of Context-Folding (Sun, Lu et al., ICML 2026, ByteDance Seed / CMU) \u2014 a framework that lets LLM agents actively manage their own working context by branching into sub-trajectories and folding them away once complete. FoldGRPO adds token-level process rewards (Unfolded Token Penalty + Out-of-Scope Penalty) to teach agents when and how to fold. Result: 10\xd7 smaller active context, +20% on BrowseComp-Plus, +8.8% on SWE-Bench Verified vs. 327K-token ReAct baselines.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/context-folding/"}},{id:"post-t3s-training-trajectory-aware-token-selection-for-continual-reasoning-distillation",title:"T3S \u2014 Training-Trajectory-Aware Token Selection for Continual Reasoning Distillation",description:"Paper review of T3S (Shen, Hu et al., ICML 2026) \u2014 a token-level fix for &quot;Imitation Shock,&quot; the failure mode where continual reasoning distillation causes all metrics to collapse simultaneously despite decreasing loss. T3S masks already-learned Imitation-Anchor Tokens from the AR loss using a trajectory-aware confidence-shift signal, enabling Qwen3-8B to exceed its DeepSeek-R1 teacher on AIME24/25 with under 1,000 training examples.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/t3s/"}},{id:"post-bg-mcts-budget-guided-tree-search-for-fixed-token-budgets-in-llm-reasoning",title:"BG-MCTS \u2014 Budget-Guided Tree Search for Fixed Token Budgets in LLM Reasoning",description:"Paper review of BG-MCTS (Miyamoto, Oba, Okazaki, ICML 2026, Institute of Science Tokyo) \u2014 a training-free MCTS variant that adapts exploration strategy in real time based on how much of the token budget remains. A budget ratio \u03c1 governs exploration annealing, completion bias, and widen annealing, producing a wide-to-deep schedule that outperforms beam search by 2\xd7 on MATH500 Level-5 hard problems at a 10K-token budget.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/bg-mcts/"}},{id:"post-blend-asc-optimal-self-consistency-via-power-law-sample-efficiency",title:"Blend-ASC \u2014 Optimal Self-Consistency via Power-Law Sample Efficiency",description:"Paper review of Blend-ASC (Feng, Alonso et al., ICML 2026, Yale / Huawei Noah&#39;s Ark Lab) \u2014 a theoretically grounded adaptive self-consistency method that achieves 6.8\xd7 sample efficiency over vanilla SC by deriving the first comprehensive power-law error decay analysis and interpolating between ASC and PPR-1v1 based on sampling progress. Evaluated on MMLU, MATH, and GPQA-Diamond across five LLM families.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/blend-asc/"}},{id:"post-sol-self-optimizing-language-models-via-token-level-efficiency-policies",title:"SOL \u2014 Self-Optimizing Language Models via Token-Level Efficiency Policies",description:"Paper review of SOL (Akhauri, Abdelfattah, ICML 2026, Cornell) \u2014 a framework that trains a lightweight policy network (via GRPO) to assign per-token efficiency actions (attention sparsity, MLP pruning, quantization) to a frozen LLM, allocating more compute to important tokens. A joint SOL-J policy achieves +7.3% MMLU accuracy over uniform budget baselines, consistently improving the Pareto front across Llama and DeepSeek-R1 models.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/sol/"}},{id:"post-wfm-tts-test-time-scaling-for-world-foundation-models",title:"WFM-TTS \u2014 Test-Time Scaling for World Foundation Models",description:"Paper review of &quot;Can Test-Time Scaling Improve World Foundation Model?&quot; (Cong, Zhu et al., COLM 2025) \u2014 the first framework that applies test-time compute scaling to video-generative world models. A 9,000x-faster efficient decoder enables beam search + top-K pruning over the token space, rule-based rewards guide selection, and a 4B COSMOS model with WFM-TTS matches a 12B baseline. Introduces a new five-dimension WFM evaluation toolkit (3D consistency, temporal coherence, spatial awareness, perceptual quality, text-video alignment).",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/wfm-tts/"}},{id:"post-monte-carlo-tree-diffusion-system-2-planning-with-diffusion-models",title:"Monte Carlo Tree Diffusion \u2014 System 2 Planning with Diffusion Models",description:"Paper review of Monte Carlo Tree Diffusion (Yoon, Cho et al., ICML 2025 Spotlight) \u2014 a framework that embeds MCTS inside the diffusion denoising process, treating partially denoised subplans as tree nodes, binary guidance schedules as meta-actions, and fast DDIM rollouts as the simulation oracle. Near-perfect success on long-horizon maze tasks where all diffusion baselines fail, with monotonically improving performance as inference compute scales.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/mctd/"}},{id:"post-video-prediction-policy-predictive-visual-representations-as-the-policy-backbone",title:"Video Prediction Policy \u2014 Predictive Visual Representations as the Policy Backbone",description:"Paper review of Video Prediction Policy (Hu, Guo et al., ICML 2025 Spotlight) \u2014 a generalist robot policy that conditions on the internal predictive representations of a fine-tuned video diffusion model and learns an implicit inverse-dynamics action head on top. +41.5% relative improvement on Calvin ABC-D and a single policy solving 100+ real-world dexterous-hand tasks.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/vpp/"}},{id:"post-dreamgen-scaling-robot-learning-by-dreaming-trajectories",title:"DreamGen \u2014 Scaling Robot Learning by Dreaming Trajectories",description:"Paper review of DreamGen (Jang, Ye et al., NVIDIA GEAR, CoRL 2025) \u2014 a four-stage pipeline that fine-tunes a video world model on a small amount of teleoperation data, dreams synthetic robot videos for new behaviors and environments, recovers pseudo-actions via IDM or latent-action models, and trains visuomotor policies on the resulting &quot;neural trajectories.&quot; Enables a humanoid to perform 22 new behaviors from just a single pick-and-place teleoperation source task.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/dreamgen/"}},{id:"post-lapa-latent-action-pretraining-from-action-label-free-video",title:"LAPA \u2014 Latent Action Pretraining from Action-Label-Free Video",description:"Paper review of LAPA (Ye, Jang et al., ICLR 2025) \u2014 a two-stage recipe that learns discrete latent actions from video frame pairs via VQ-VAE, pretrains a Vision-Language-Action model to predict these latent actions from observations and language, then fine-tunes a small action decoder on robot data. Beats OpenVLA by +6.22% on real-robot evaluation with ~30\xd7 lower pretraining compute and no ground-truth action labels at scale.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/lapa/"}},{id:"post-flow-matching-the-simulation-free-recipe-under-modern-diffusion",title:"Flow Matching \u2014 The Simulation-Free Recipe Under Modern Diffusion",description:"Paper review of Flow Matching for Generative Modeling (Lipman et al., ICLR 2023) \u2014 the paper that turned Continuous Normalizing Flows from &quot;elegant but untrainable&quot; into a simulation-free regression problem, introduced optimal-transport conditional paths that beat diffusion on FID/NLL/NFE simultaneously, and became the training objective under SD3, Wan, and DreamZero.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/flow-matching/"}},{id:"post-dreamzero-world-action-models-as-zero-shot-robot-policies",title:"DreamZero \u2014 World Action Models as Zero-shot Robot Policies",description:"Paper review of DreamZero (Ye, Ge et al., NVIDIA GEAR, 2026) \u2014 a 14B World Action Model built on a pretrained video diffusion backbone that jointly predicts future video frames and robot actions, delivering 2\xd7 generalization to unseen tasks vs. state-of- the-art VLAs and running real-time closed-loop control at 7Hz.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/dreamzero/"}},{id:"post-polar-agentic-rl-on-any-harness-at-scale",title:"Polar \u2014 Agentic RL on Any Harness at Scale",description:"Paper review of Polar (Xu et al., NVIDIA, 2026) \u2014 a rollout framework that treats any agent harness as a black box, proxies LLM API calls to record token-level interactions, reconstructs token-faithful trajectories for RL training, and improves Qwen3.5-4B by up to +22.6 points on SWE-Bench Verified across four different harnesses.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/polar-agentic-rl/"}},{id:"post-from-rlhf-to-ruler-how-the-reward-signal-for-rl-agents-evolved",title:"From RLHF to RULER: How the Reward Signal for RL Agents Evolved",description:"Trend note tracing the RL reward-signal problem from RLHF&#39;s four-model PPO stack (2022) through RLVR+GRPO&#39;s two-model breakthrough (2025) to RULER&#39;s LLM-as-judge scoring for non-verifiable agent tasks (2026), with a walkthrough of OpenPipe&#39;s ART framework.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/rlhf-to-ruler/"}},{id:"post-alpaserve-statistical-multiplexing-with-model-parallelism-for-dl-serving",title:"AlpaServe \u2014 Statistical Multiplexing with Model Parallelism for DL Serving",description:"Paper review of AlpaServe (Li et al., OSDI 2023) \u2014 the systems paper that argued model parallelism is not just for fitting big models on big clusters but for *statistically multiplexing* bursty multi-model workloads, and showed it can serve requests at up to 10\xd7 higher rates or absorb 6\xd7 more burstiness at &gt;99% SLO attainment.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/alpaserve/"}},{id:"post-leworldmodel-a-15m-parameter-jepa-that-actually-trains-end-to-end-from-pixels",title:"LeWorldModel \u2014 A 15M-Parameter JEPA That Actually Trains End-to-End from Pixels",description:"Paper review of LeWorldModel (Maes, Le Lidec, Scieur, LeCun, Balestriero, 2026) \u2014 a Joint-Embedding Predictive Architecture for action-conditioned world modeling whose two-term loss (next-embedding MSE + SIGReg) collapses six tunable hyperparameters into one, trains stably from raw pixels at ~15M parameters on a single GPU, and plans 48\xd7 faster than DINO-WM on PushT.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/leworldmodel/"}},{id:"post-frontiersmith-manufacturing-open-ended-coding-problems-to-train-better-code-agents",title:"FrontierSmith \u2014 Manufacturing Open-Ended Coding Problems to Train Better Code Agents",description:"Paper review of FrontierSmith (FrontierCS Team, 2026) \u2014 an automated pipeline that mutates closed-ended competitive-programming problems into open-ended ones, filters them with an &quot;idea divergence&quot; metric, and uses the resulting data to substantially boost coding LLMs on FrontierCS and ALE-Bench.",section:"Posts",handler:()=>{window.location.href="/log/blog/2026/frontiersmith/"}},{id:"post-echo-terminal-agents-learn-world-models-for-free",title:"ECHO \u2014 Terminal Agents Learn World Models for Free",description:"Trend note on ECHO (Shrivastava &amp; Papailiopoulos, 2026) \u2014 a one-line change to GRPO for CLI agents that stops masking out te
